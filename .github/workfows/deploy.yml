name: Continuous Integration & Deployment (CI/CD) a Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: mi-app-node-prod
  REGION: us-central1
  SERVICE_NAME: mi-app-node-tf
  GAR_REPOSITORY: app-repo-tf

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Autenticar en GCP usando la clave JSON guardada en GitHub Secrets (GCP_SA_KEY)
      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Autenticar el motor de Docker en el Runner con Artifact Registry
      - name: Autenticar Docker en GCP
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 4. Compilar y realizar Push de la imagen Docker usando el SHA inmutable del commit
      - name: Build y Push de la Imagen Docker
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      # 5. Desplegar directamente el servicio a Cloud Run mediante la acción oficial de Google
      - name: Desplegar en Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'